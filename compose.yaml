services:
  wallet-gateway:
    # SIWE wallet gate: https://github.com/rube-de/hermes-wallet-gateway
    # Use the published image or build your own (see that repo).
    # Pinned by digest: a restart reuses the machine's cached :latest, so a new
    # push only lands by bumping this digest (and `just ship`).
    image: ghcr.io/rube-de/hermes-wallet-gateway:latest@sha256:28892014135bc3ff7114b9988153e53f9227a43b2b4030c6c4dd57fae76e8f19
    restart: unless-stopped
    depends_on:
      - hermes-dashboard
      - hermes-security-dashboard
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HERMES_TARGET=http://hermes-dashboard:9119
      # Path-routed second upstream behind the same SIWE gate: /security/* -> the
      # security dashboard; every other path falls through to HERMES_TARGET. The
      # gateway forwards the path untouched, so the upstream image bakes
      # BASE_PATH=/security. https://github.com/rube-de/hermes-wallet-gateway
      - 'GATEWAY_ROUTES={"/security":"http://hermes-security-dashboard:3000"}'
      - WALLET_CHAIN_ID=1
      - WALLET_SESSION_TTL=43200
      - WALLET_STATEMENT=Sign in to the Hermes dashboard.
      # --- the two ROFL secrets (injected as env by the TEE) ---
      - WALLET_WHITELIST=${WALLET_WHITELIST}
      - WALLET_SESSION_SECRET=${WALLET_SESSION_SECRET}
      # Set this to the proxy host AFTER first deploy (oasis rofl machine show),
      # then `oasis rofl update`. Until then SIWE domain-binding can't be final.
      - WALLET_DOMAIN=${WALLET_DOMAIN}

  hermes-dashboard:
    # Pinned by tag+digest — bump deliberately, don't float on :latest (mutable
    # tags + pull_policy: always filled the machine's disk on every restart).
    image: docker.io/nousresearch/hermes-agent:v2026.8.13@sha256:68e15ae2a6d894d0ccbd9f8aacbbe13d4d28fa5dc9b6a303970b67bb2499b1a6
    platform: linux/amd64
    restart: unless-stopped
    # Gated on the restore like its siblings. Failing closed is correct here:
    # serving the dashboard off an unrestored volume shows an empty agent as if
    # it were real.
    # No depends_on by design. podman-compose turns a
    # `service_completed_successfully` dependency into podman's --requires,
    # which demands the dependency be RUNNING -- and re-triggers that one-shot
    # once per dependent. Every dependent therefore paid a full re-run:
    # measured 300s each on the rclone path, and 1800s once the restore stopped
    # publishing a sentinel, which is the 40-minute boot. Ordering is the
    # sentinel's job -- see wait_for_restore in the services below.
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Wait for the restore before serving. Without this a disaster-recovery
        # boot starts against a volume still being restored.
        marker=/opt/data/.restore-complete
        inprogress=/opt/data/.restore-inprogress
        bootid=$$(cat /proc/sys/kernel/random/boot_id)
        waited=0
        stalled=0
        while [ "$$(cat "$$marker" 2>/dev/null)" != "$$bootid" ]; do
          if [ "$$(cat "$$inprogress" 2>/dev/null)" = "$$bootid" ]; then
            stalled=0
          else
            stalled=$$(( stalled + 5 ))
          fi
          if [ "$$stalled" -ge "$${WAIT_MAX:-1200}" ]; then
            if [ -z "$$(find /opt/data -mindepth 1 \
                          ! -name '.restore-*' ! -name .boot-trace \
                          ! -name .bashrc ! -name .profile ! -name .bash_logout \
                          -print -quit 2>/dev/null)" ]; then
              echo "[hermes-dash] FATAL: volume empty and no restore after $${stalled}s" >&2
              exit 1
            fi
            echo "[hermes-dash] WARN: no restore sentinel for $${stalled}s, starting" >&2
            break
          fi
          [ $$(( waited % 60 )) -eq 0 ] && echo "[hermes-dash] waiting for restic-restore ($${waited}s)"
          sleep 5
          waited=$$(( waited + 5 ))
        done
        echo "$$(date -u +%FT%TZ) hermes-dash    proceeded after $${waited}s" >> /opt/data/.boot-trace 2>/dev/null || true
        exec /opt/hermes/docker/entrypoint-dispatch.sh "$$@"
      - "--"
    # Bind to all interfaces on the internal network. Hermes requires its own
    # auth provider for non-loopback binds, in addition to the wallet gateway.
    command:
      [
        "dashboard",
        "--host",
        "0.0.0.0",
        "--port",
        "9119",
        "--no-open",
        "--skip-build",
      ]
    volumes:
      - hermes-data:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}

  hermes-security-dashboard:
    # SIWE-gated security findings dashboard, served under /security by the
    # wallet-gateway (see GATEWAY_ROUTES). The image is built with
    # BASE_PATH=/security baked in, so it answers only under that prefix.
    # https://github.com/rube-de/hermes-security-dashboard
    # No `ports:` — like hermes-dashboard, the gateway is the sole perimeter;
    # reachable internally at http://hermes-security-dashboard:3000.
    # Pinned by digest like wallet-gateway: a restart reuses the machine's cached
    # tag, so a new push only lands by bumping this digest (and `just ship`).
    image: ghcr.io/rube-de/hermes-security-dashboard:latest-security@sha256:e93a39216bdc7894e8b76d6d0ec80eff0ac3c8a7a6f39a21bac36393fc744627
    platform: linux/amd64
    restart: unless-stopped
    # Wraps the image's own entrypoint rather than replacing its command, so the
    # image CMD (["node","build"]) still reaches docker-entrypoint.sh untouched
    # and the wrap cannot change what actually runs. This one matters more than
    # the other dashboard: it rebuilds its live DB from security/snapshot.db at
    # boot and writes that snapshot back every HERMES_SNAPSHOT_INTERVAL, so an
    # ungated start on a recovering volume would overwrite the restored findings
    # with an empty database.
    entrypoint:
      - /bin/sh
      - -c
      - |
        marker=/data/.restore-complete
        inprogress=/data/.restore-inprogress
        bootid=$$(cat /proc/sys/kernel/random/boot_id)
        waited=0
        stalled=0
        while [ "$$(cat "$$marker" 2>/dev/null)" != "$$bootid" ]; do
          if [ "$$(cat "$$inprogress" 2>/dev/null)" = "$$bootid" ]; then
            stalled=0
          else
            stalled=$$(( stalled + 5 ))
          fi
          if [ "$$stalled" -ge "$${WAIT_MAX:-1200}" ]; then
            if [ -z "$$(find /data -mindepth 1 \
                          ! -name '.restore-*' ! -name .boot-trace \
                          ! -name .bashrc ! -name .profile ! -name .bash_logout \
                          -print -quit 2>/dev/null)" ]; then
              echo "[security-dash] FATAL: volume empty and no restore after $${stalled}s" >&2
              exit 1
            fi
            echo "[security-dash] WARN: no restore sentinel for $${stalled}s, starting" >&2
            break
          fi
          [ $$(( waited % 60 )) -eq 0 ] && echo "[security-dash] waiting for restic-restore ($${waited}s)"
          sleep 5
          waited=$$(( waited + 5 ))
        done
        # Braced so a failed redirect is silenced too: this container runs as uid
        # 10000 and the volume root is root-owned, so the append may not be
        # permitted. The trace is diagnostics, never a reason to fail the boot.
        { echo "$$(date -u +%FT%TZ) security-dash  proceeded after $${waited}s" >> /data/.boot-trace; } 2>/dev/null || true
        exec docker-entrypoint.sh "$$@"
      - "--"
    # Stated explicitly rather than inherited from the image. Overriding
    # `entrypoint:` clears the image CMD under docker compose (podman-compose
    # happens to keep it), and with no args the image's docker-entrypoint.sh
    # falls back to bare `node`, which exits at once and restart-loops the
    # container. Naming it here makes the wrap independent of that difference.
    command: ["node", "build"]
    # No depends_on by design. podman-compose turns a
    # `service_completed_successfully` dependency into podman's --requires,
    # which demands the dependency be RUNNING -- and re-triggers that one-shot
    # once per dependent. Every dependent therefore paid a full re-run:
    # measured 300s each on the rclone path, and 1800s once the restore stopped
    # publishing a sentinel, which is the 40-minute boot. Ordering is the
    # sentinel's job -- see wait_for_restore in the services below.
    environment:
      # Live WAL DB is isolated under security/live/ (excluded from the backup);
      # only the VACUUM-INTO snapshot at security/snapshot.db is archived.
      # Copying a live SQLite file byte-for-byte is unsafe.
      - HERMES_DB=/data/security/live/hermes.db
      - HERMES_DB_SNAPSHOT=/data/security/snapshot.db
      - HERMES_SNAPSHOT_INTERVAL=300
      # Start empty; the security-review cron pushes real findings via the API.
      - HERMES_SEED_DEMO=false
      # ROFL secret — also given to the review cron so its writes authenticate.
      - HERMES_API_TOKEN=${HERMES_API_TOKEN}
    volumes:
      - hermes-data:/data

  hermes:
    # Pinned by tag+digest — see hermes-dashboard for why we stopped floating on :latest.
    image: docker.io/nousresearch/hermes-agent:v2026.8.13@sha256:68e15ae2a6d894d0ccbd9f8aacbbe13d4d28fa5dc9b6a303970b67bb2499b1a6
    platform: linux/amd64
    restart: unless-stopped
    # No depends_on by design. podman-compose turns a
    # `service_completed_successfully` dependency into podman's --requires,
    # which demands the dependency be RUNNING -- and re-triggers that one-shot
    # once per dependent. Every dependent therefore paid a full re-run:
    # measured 300s each on the rclone path, and 1800s once the restore stopped
    # publishing a sentinel, which is the 40-minute boot. Ordering is the
    # sentinel's job -- see wait_for_restore in the services below.
    command:
      - sh
      - -c
      - |
        # Ordering gate. Must run before ANY write below: `mkdir /opt/data/vault`
        # alone would make the volume look populated to restic-restore's guard, so
        # on a fresh machine the restore would skip and disaster recovery would
        # silently come up as an empty agent.
        #
        # Same rule as the backup services: match the sentinel against this boot's
        # kernel boot_id, and let the bound measure time with NO restore running,
        # so a slow first-ever restore is never timed out from under us.
        marker=/opt/data/.restore-complete
        inprogress=/opt/data/.restore-inprogress
        bootid=$$(cat /proc/sys/kernel/random/boot_id)
        waited=0
        stalled=0
        while [ "$$(cat "$$marker" 2>/dev/null)" != "$$bootid" ]; do
          if [ "$$(cat "$$inprogress" 2>/dev/null)" = "$$bootid" ]; then
            stalled=0
          else
            stalled=$$(( stalled + 5 ))
          fi
          if [ "$$stalled" -ge "$${WAIT_MAX:-1200}" ]; then
            # An empty volume means this is a real recovery and the restore has not
            # happened. Starting would initialise a blank agent over the top, so
            # fail loudly instead and let restart: unless-stopped retry.
            if [ -z "$$(find /opt/data -mindepth 1 \
                          ! -name '.restore-*' ! -name .boot-trace \
                          ! -name .bashrc ! -name .profile ! -name .bash_logout \
                          -print -quit 2>/dev/null)" ]; then
              echo "[hermes] FATAL: volume empty and no restore after $${stalled}s" >&2
              exit 1
            fi
            echo "[hermes] WARN: no restore sentinel for $${stalled}s, volume has data, starting" >&2
            break
          fi
          [ $$(( waited % 60 )) -eq 0 ] && echo "[hermes] waiting for restic-restore ($${waited}s)"
          sleep 5
          waited=$$(( waited + 5 ))
        done
        echo "$$(date -u +%FT%TZ) hermes         proceeded after $${waited}s" >> /opt/data/.boot-trace 2>/dev/null || true

        mkdir -p /opt/data/vault
        if [ ! -f /opt/data/.compose-initialized ]; then
          cat > /opt/data/config.yaml <<'CFG'
        model:
          provider: zai
          default: glm-5-turbo
          base_url: https://api.z.ai/api/coding/paas/v4
          api_mode: chat_completions
        CFG
          touch /opt/data/.compose-initialized
          echo "[hermes] first boot: wrote default config.yaml from compose"
        fi
        exec hermes gateway run
    environment:
      - GLM_BASE_URL=https://api.z.ai/api/coding/paas/v4
      - GLM_API_KEY=${GLM_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Base URL set explicitly: Hermes only auto-routes to the coding endpoint
      # for keys prefixed `sk-kimi-`, otherwise it uses the legacy moonshot host.
      - KIMI_BASE_URL=https://api.kimi.com/coding
      - KIMI_API_KEY=${KIMI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_GROUP_ALLOWED_CHATS=${TELEGRAM_GROUP_ALLOWED_CHATS}
      # Bearer token so this agent's security-review writes authenticate to the dashboard API.
      - HERMES_API_TOKEN=${HERMES_API_TOKEN}
      - HERMES_UID=10000
      - HERMES_GID=10000
    volumes:
      - hermes-data:/opt/data

  # Runs every boot, before hermes/hermes-dashboard start pulling their large
  # images. Removes package-manager download caches (pnpm/uv/npm/pip, the go
  # module cache, toolchain downloads) under hermes-data — these regrow as the
  # agent works, and previously filled the machine's disk with no eviction.
  #
  # Only genuine caches belong in this list. The repo checkouts in repo/ are
  # canonical inputs, and home/.npm-global is an install prefix (gh and other
  # CLIs live in its bin/), so both must survive every boot. Do not prune
  # repos here on age or disk pressure either. Agent-authored data (state.db,
  # security-review-runs, skills, sessions, vault, memories) is left alone too.
  # `just test-cache-prune` runs this block against a fixture to hold that line.
  cache-prune:
    image: docker.io/library/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: "no"
    # Gated on the restore so the two never touch the volume at once; this
    # previously depended on nothing and could delete paths mid-restore.
    # No depends_on by design. podman-compose turns a
    # `service_completed_successfully` dependency into podman's --requires,
    # which demands the dependency be RUNNING -- and re-triggers that one-shot
    # once per dependent. Every dependent therefore paid a full re-run:
    # measured 300s each on the rclone path, and 1800s once the restore stopped
    # publishing a sentinel, which is the 40-minute boot. Ordering is the
    # sentinel's job -- see wait_for_restore in the services below.
    volumes:
      - hermes-data:/data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trace() { echo "$$(date -u +%FT%TZ) cache-prune    $$1" >> /data/.boot-trace 2>/dev/null || true; }
        trace start

        # Same constraint as restic-restore: podman fails any dependent whose
        # required container is not RUNNING, and hermes plus both dashboards
        # require this one. Previously this waited minutes for the rclone
        # restore sentinel, which kept it alive long enough by accident; the
        # restic sentinel lands in under a second, so it has to hold open
        # deliberately. Nothing waits on this exit.
        finish() {
          echo "[cache-prune] $$1"
          trace "exit: $$1"
          echo "[cache-prune] holding $${CACHE_PRUNE_LINGER:-0}s so dependents can start"
          sleep "$${CACHE_PRUNE_LINGER:-0}"
          exit 0
        }
        wait_for_restore() {
          marker=/data/.restore-complete
          bootid=$$(cat /proc/sys/kernel/random/boot_id)
          waited=0
          while :; do
            if [ "$$(cat "$$marker" 2>/dev/null)" = "$$bootid" ]; then
              trace "proceeded after $${waited}s"
              echo "[cache-prune] restore sentinel is fresh, proceeding"
              return 0
            fi
            if [ "$$waited" -ge 1800 ]; then
              echo "[cache-prune] WARN: no restore sentinel after 30m, skipping prune" >&2
              return 1
            fi
            [ $$(( waited % 60 )) -eq 0 ] && \
              echo "[cache-prune] waiting for restic-restore to finish ($${waited}s)"
            sleep 5; waited=$$(( waited + 5 ))
          done
        }

        if ! wait_for_restore; then
          finish "no restore sentinel, prune skipped"
        fi

        # Counted on both sides of the rm so the checkouts and installed tools
        # can be seen to survive. Traced too: ROFL drops some containers' stdout.
        kept() {
          msg="$$1: $$(ls -A /data/repo 2>/dev/null | wc -l) entries in repo/, $$(ls -A /data/home/.npm-global/bin 2>/dev/null | wc -l) in .npm-global/bin"
          echo "[cache-prune] $$msg"
          trace "$$msg"
        }

        kept before
        echo "[cache-prune] before:"; df -h /data
        rm -rf \
          /data/home/.local/share/pnpm \
          /data/home/.cache/uv \
          /data/home/.cache/pnpm \
          /data/home/.cache/node \
          /data/home/.npm \
          /data/home/.cache/pip \
          /data/profiles/*/home/go/pkg/mod \
          /data/toolchains/*-download \
          2>/dev/null
        echo "[cache-prune] after:"; df -h /data
        kept after
        finish "prune complete"


  # ─────────────────────── restic / Cloudflare R2 ───────────────────────
  # The backup path. Replaced the rclone sync + restore pair, now removed.
  #
  # Why: `rclone sync` is a mirror, not a backup — no restore points, and a bad
  # write reached the remote within SYNC_INTERVAL. It also issued one HEAD per
  # object per cycle (~75,500 at the current object count) because the S3
  # backend keeps mtime in object metadata rather than in the list response;
  # restic consults its own index, so a cycle costs ~20 requests regardless of
  # file count (measured at 20,000 files: 20,022 vs 17).
  #
  # The rclone restore also became the boot bottleneck. podman-compose re-runs a
  # service_completed_successfully dependency once per dependent, and each pass
  # listed 75k objects; when that began stalling into rclone's 5-minute idle
  # timeout, eight passes turned a boot into 40 minutes AND the restore never
  # completed, so backups stopped for ~18 hours. restic reads its index instead.
  #
  # Akave secrets are retained for now as the rollback path.

  restic-restore:
    image: "docker.io/restic/restic:0.17.3@sha256:8f5a62b422a2cb1277ea0dd6e826fe1acf649e5b9f02d60e5268d5fd1976255a"
    platform: linux/amd64
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu

        BOOT_ID=$$(cat /proc/sys/kernel/random/boot_id)
        SENTINEL=/opt/data/.restore-complete
        INPROGRESS=/opt/data/.restore-inprogress
        FORCE=$${RESTIC_FORCE_RESTORE:-0}

        # ROFL captures stdout from only some containers, so the ordering is
        # also recorded on the volume, where restic archives it and `restic
        # dump` can read it back after the fact.
        trace() { echo "$$(date -u +%FT%TZ) restic-restore $$1" >> /opt/data/.boot-trace 2>/dev/null || true; }
        trace "start (force=$$FORCE)"

        mark_done() {
          # Sentinel first, then clear the marker: a crash between the two
          # leaves waiters proceeding, never waiting forever.
          echo "$$BOOT_ID" > "$$SENTINEL"
          rm -f "$$INPROGRESS"
          echo "[restic-restore] sentinel written: $$SENTINEL"
        }

        # podman-compose maps `condition: service_completed_successfully` onto
        # podman's --requires, and podman refuses to start a container whose
        # required container is not RUNNING -- it fails the dependent with
        # "container state improper". A one-shot that exits in under a second
        # therefore breaks every dependent, permanently: measured in production
        # the moment this replaced rclone-restore, whose multi-minute runtime had
        # masked the problem by always being alive when dependents were started.
        # (It also explains the 8 rclone-restore runs per boot: each dependent's
        # start re-triggered the required container.)
        #
        # So hold the container open past the window in which podman starts the
        # dependents. This delays nothing: the sentinel is published before we
        # get here, and every waiter keys off the sentinel, not off this exit.
        finish() {
          echo "[restic-restore] $$1"
          trace "exit: $$1"
          echo "[restic-restore] holding $${RESTORE_LINGER:-0}s so dependents can start"
          sleep "$${RESTORE_LINGER:-0}"
          exit 0
        }

        # podman-compose re-executes a service_completed_successfully dependency
        # once per dependent: measured 8 rclone-restore runs in a single boot,
        # ~100s apart, which is most of the ~14 minute boot time. Restoring more
        # than once per boot is at best wasted work and at worst destructive --
        # restic-restore uses --overwrite always, so a second pass while the
        # agent is live would revert its work to the snapshot.
        #
        # The sentinel holds this boot's kernel boot_id and is written only on
        # success, so a failed restore leaves no matching marker and the next
        # invocation still retries. Only a completed restore is skipped.
        # RESTIC_FORCE_RESTORE bypasses EVERY guard. A deliberate recovery is
        # normally run on a machine that has already booted and restored, so the
        # sentinel already matches this boot -- checking it first would make the
        # escape hatch unusable exactly when it is needed.
        if [ "$$FORCE" != "1" ] && \
           [ "$$(cat "$$SENTINEL" 2>/dev/null)" = "$$BOOT_ID" ]; then
          finish "already restored this boot, nothing to do"
        fi

        # A sibling invocation is restoring RIGHT NOW. Without this, the
        # populated-volume guard below would see the files that sibling has
        # written so far, conclude the volume already holds data, and publish a
        # sentinel while the restore is still in flight -- releasing every
        # waiter onto a half-restored tree, on the one path where a full restore
        # is actually happening. Wait for the sibling's verdict instead.
        if [ "$$FORCE" != "1" ] && \
           [ "$$(cat "$$INPROGRESS" 2>/dev/null)" = "$$BOOT_ID" ]; then
          echo "[restic-restore] another invocation is restoring, waiting for it"
          waited=0
          while [ "$$(cat "$$SENTINEL" 2>/dev/null)" != "$$BOOT_ID" ]; do
            if [ "$$waited" -ge "$${RESTORE_WAIT_MAX:-1800}" ]; then
              echo "[restic-restore] FATAL: sibling restore unfinished after $${waited}s" >&2
              trace "exit: sibling restore timed out after $${waited}s"
              exit 1
            fi
            sleep 5; waited=$$(( waited + 5 ))
          done
          finish "sibling restore finished after $${waited}s"
        fi

        # An "empty" volume is never literally empty: the hermes image ships
        # .bashrc/.profile/.bash_logout at /opt/data (its HOME), and podman seeds a
        # fresh named volume from image content at mount time, before any process
        # runs. Counting those as data makes a brand-new machine look populated and
        # skips the one restore that matters. Anything else present still counts,
        # so this stays fail-safe against overwriting a live volume.
        # Never overwrite a populated volume. restic restores with
        # --overwrite always, so running it against a machine that already holds
        # live state would revert that state to the last snapshot. The volume
        # survives reboots, so the ordinary case is "the data is already here"
        # and the correct action is to do nothing.
        #
        # A genuinely fresh machine has an empty volume and IS restored -- that
        # is the disaster-recovery path. Recovering onto existing data is a
        # deliberate act:
        #   docker compose run --rm -e RESTIC_FORCE_RESTORE=1 restic-restore
        #
        # The exception is a marker left by an EARLIER boot: that boot began a
        # restore and never finished it, so what is on the volume is a partial
        # tree. Trusting it would leave the machine permanently half-restored,
        # since every later boot would see "populated" and skip.
        if [ -f "$$INPROGRESS" ]; then
          echo "[restic-restore] previous boot died mid-restore, volume is partial"
          trace "stale in-progress marker: restoring over partial tree"
        elif [ "$$FORCE" != "1" ] && \
             [ -n "$$(find /opt/data -mindepth 1 \
                        ! -name .restore-complete ! -name .restore-inprogress \
                        ! -name .boot-trace \
                        ! -name .bashrc ! -name .profile ! -name .bash_logout \
                        -print -quit 2>/dev/null)" ]; then
          mark_done
          finish "volume already holds data, not restoring"
        fi

        echo "[restic-restore] starting at $$(date -u +%FT%TZ)"

        # Fail CLOSED. `restic snapshots` exits non-zero for an absent repo,
        # wrong credentials and network failure alike, and exits 0 printing "[]"
        # only for a reachable-but-empty repository (both measured). So
        # "cannot reach it" can never be read as "nothing to restore".
        #
        # The repository is created ONCE by hand (`just restic-init`), never
        # here. Running `restic init` on this path would turn any transient
        # error into a silent second empty repository beside the real one.
        if ! snaps=$$(restic snapshots --host "$$RESTIC_HOST" --json 2>&1); then
          echo "[restic-restore] FATAL: repository unreachable or uninitialised" >&2
          echo "$$snaps" >&2
          trace "exit: repository unreachable"
          exit 1
        fi
        if [ "$$(printf '%s' "$$snaps" | tr -d '[:space:]')" = "[]" ]; then
          mark_done
          finish "repository is empty (first-ever deployment), nothing to restore"
        fi

        # --target / is correct: the snapshot records the absolute path
        # /opt/data, so restic recreates it exactly there. The seeding backup
        # must therefore also run against /opt/data, or the restore lands
        # elsewhere and this volume silently stays empty.
        echo "[restic-restore] restoring latest snapshot for host $$RESTIC_HOST"

        # Claim the restore only once it is about to write. Claiming any earlier
        # -- before the reachability check above -- would strand the marker on a
        # machine whose volume was never touched, and the next boot would read
        # that as "partial tree" and restore destructively over live data.
        echo "$$BOOT_ID" > "$$INPROGRESS"
        trace "restore started"
        restic restore latest --host "$$RESTIC_HOST" --target / --overwrite always

        # The backup deliberately holds the VACUUM INTO copies rather than the live
        # SQLite files, so a restore alone leaves the agent with no databases at
        # all -- measured on a real recovery drill: state.db absent while a 298 MB
        # clean copy sat unused in db-snapshots/. Putting them back is the other
        # half of that design and was missing.
        #
        # This runs before the sentinel is published, so nothing starts until the
        # databases are in place. An existing live file is never overwritten.
        reinstate_dbs() {
          snapdir=/opt/data/db-snapshots
          [ -d "$$snapdir" ] || return 0
          put=0; kept=0
          if [ -f "$$snapdir/.manifest" ]; then
            while IFS="$$(printf '\t')" read -r fname rel; do
              [ -n "$$rel" ] && [ -f "$$snapdir/$$fname" ] || continue
              dest=/opt/data/$$rel
              if [ -e "$$dest" ]; then kept=$$(( kept + 1 )); continue; fi
              mkdir -p "$$(dirname "$$dest")"
              cp "$$snapdir/$$fname" "$$dest" && put=$$(( put + 1 ))
            done < "$$snapdir/.manifest"
          else
            # Snapshots taken before the manifest existed: fall back to decoding
            # the name. Correct for every current path, and only ever creates
            # files that are missing, so a bad guess cannot destroy anything.
            for f in "$$snapdir"/*.db; do
              [ -f "$$f" ] || continue
              rel=$$(basename "$$f" | sed 's|__|/|g')
              dest=/opt/data/$$rel
              if [ -e "$$dest" ]; then kept=$$(( kept + 1 )); continue; fi
              mkdir -p "$$(dirname "$$dest")"
              cp "$$f" "$$dest" && put=$$(( put + 1 ))
            done
          fi
          echo "[restic-restore] databases reinstated: $$put restored, $$kept already present"
        }
        reinstate_dbs

        count=$$(find /opt/data -type f | wc -l)
        size=$$(du -sh /opt/data | awk '{print $$1}')
        echo "[restic-restore] complete: $$count files, $$size"
        mark_done
        finish "restored $$count files ($$size)"
    environment:
      - HOME=/tmp
      - RESTIC_CACHE_DIR=/tmp/restic-cache
      # Pinned identity. Without it each container's random hostname forms its
      # own retention group, and `restic forget` then deletes NOTHING while
      # still exiting 0 — measured: --keep-last 2 left all 6 snapshots in place.
      - RESTIC_HOST=rofl
      - RESTIC_REPOSITORY=s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=auto
    volumes:
      - hermes-data:/opt/data

  # Keeps consistent copies of the live SQLite databases for restic-backup to
  # archive. Copying a hot SQLite file byte-for-byte can capture a torn write;
  # VACUUM INTO takes a proper read lock and emits a clean, compacted file.
  #
  # This runs on its own timer rather than as a one-shot, mirroring what
  # hermes-security-dashboard already does with HERMES_SNAPSHOT_INTERVAL. The
  # interval is half the backup interval, so whatever restic picks up is at
  # most DB_SNAPSHOT_INTERVAL old regardless of how the two loops drift.
  #
  # python:3.12-alpine ships SQLite 3.53.2, so the stdlib sqlite3 module covers
  # this with no package installed at runtime.
  db-snapshot:
    image: "docker.io/library/python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df"
    platform: linux/amd64
    restart: unless-stopped
    # Same reason as restic-backup: never VACUUM a database mid-restore.
    # No depends_on by design. podman-compose turns a
    # `service_completed_successfully` dependency into podman's --requires,
    # which demands the dependency be RUNNING -- and re-triggers that one-shot
    # once per dependent. Every dependent therefore paid a full re-run:
    # measured 300s each on the rclone path, and 1800s once the restore stopped
    # publishing a sentinel, which is the 40-minute boot. Ordering is the
    # sentinel's job -- see wait_for_restore in the services below.
    entrypoint: /usr/local/bin/python
    command:
      - -u
      - -c
      - |
        import os, pathlib, signal, sqlite3, sys, time

        interval = int(os.environ.get("DB_SNAPSHOT_INTERVAL", "1800"))
        root = pathlib.Path("/opt/data")
        out = root / "db-snapshots"

        stopping = False
        def stop(*_):
            global stopping
            print("[db-snapshot] signal received, will exit after this cycle")
            stopping = True
        signal.signal(signal.SIGTERM, stop)
        signal.signal(signal.SIGINT, stop)

        # Path fragments whose databases are not agent state worth a consistent
        # copy. Snapshotting these doubled their size on disk for nothing, and
        # restic excludes most of them anyway so the copies were never even
        # archived. The pnpm store index is the worst offender: it is a package
        # cache that cache-prune deletes outright.
        SKIP_PARTS = (
            "/cache/", "/.cache/", "/node_modules/", "/.venv/",
            "/.local/share/pnpm/", "/.local/share/pki/", "/.npm/",
            "/repo/", "/toolchains/", "/lazy-packages/",
        )

        def cycle():
            # security/live is skipped: hermes-security-dashboard writes its own
            # VACUUM INTO snapshot to security/snapshot.db on its own schedule --
            # and that snapshot is skipped too, since copying it would be
            # snapshotting a snapshot.
            skip = {out, root / "security" / "live"}
            out.mkdir(parents=True, exist_ok=True)
            found = failed = 0
            expected = {".manifest"}
            mapping = []
            for db in sorted(root.rglob("*.db")):
                if set(db.parents) & skip:
                    continue
                rel = "/" + db.relative_to(root).as_posix()
                if any(part in rel for part in SKIP_PARTS):
                    continue
                if rel == "/security/snapshot.db":
                    continue
                found += 1
                rel_path = db.relative_to(root).as_posix()
                dest = out / rel_path.replace("/", "__")
                mapping.append((dest.name, rel_path))
                tmp = dest.with_name(dest.name + ".tmp")
                expected.add(dest.name)
                try:
                    start = time.time()
                    con = sqlite3.connect(f"file:{db}?mode=ro", uri=True, timeout=60)
                    try:
                        tmp.unlink(missing_ok=True)
                        con.execute("VACUUM INTO ?", (str(tmp),))
                    finally:
                        con.close()
                    # Atomic rename, so a backup running concurrently — or a
                    # machine killed mid-VACUUM — never sees a partial file.
                    tmp.replace(dest)
                    print(f"[db-snapshot] {db} -> {dest.name} "
                          f"({dest.stat().st_size} bytes, {time.time() - start:.1f}s)")
                except Exception as exc:
                    failed += 1
                    tmp.unlink(missing_ok=True)
                    print(f"[db-snapshot] WARN: {db}: {exc}", file=sys.stderr)
            # The restore reinstates these copies to their live paths, and it must
            # not have to reverse the "/" -> "__" encoding to work out where each
            # one belongs: a profile named foo__bar would decode to foo/bar. Record
            # the mapping instead of inferring it.
            (out / ".manifest").write_text(
                "".join(f"{name}\t{rel}\n" for name, rel in sorted(mapping)))

            # Drop snapshots whose source database is gone. Without this a
            # renamed or deleted database leaves its copy here forever, and this
            # directory is on the same disk as everything else.
            removed = 0
            for stale in out.iterdir():
                if stale.is_file() and stale.name not in expected:
                    stale.unlink(missing_ok=True)
                    removed += 1
                    print(f"[db-snapshot] removed orphaned snapshot {stale.name}")
            total = sum(f.stat().st_size for f in out.iterdir() if f.is_file())
            print(f"[db-snapshot] cycle complete: {found} databases, {failed} failed, "
                  f"{removed} orphaned removed, {total / 1048576:.1f} MiB on disk")

        def trace(event):
            # Mirrors the shell services: ROFL captures stdout from only some
            # containers, so ordering is recorded on the volume where restic
            # archives it and `restic dump` can read it back.
            try:
                with open(root / ".boot-trace", "a") as fh:
                    fh.write(f"{time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())} "
                             f"db-snapshot    {event}\n")
            except Exception:
                pass

        def wait_for_restore():
            # Same rule as the shell services: match the kernel boot_id, so a
            # marker left by a previous boot cannot wave us through onto a volume
            # that is still being restored. No clock involved -- see the shell
            # waiters for why that matters on a TDX VM.
            marker = root / ".restore-complete"
            inprogress = root / ".restore-inprogress"
            with open("/proc/sys/kernel/random/boot_id") as fh:
                bootid = fh.read().strip()

            def reads(path):
                try:
                    return path.read_text().strip()
                except OSError:
                    return None

            waited = stalled = 0
            while not stopping:
                if reads(marker) == bootid:
                    trace(f"proceeded after {waited}s")
                    print("[db-snapshot] restore sentinel is fresh, proceeding")
                    return True
                # Same rule as restic-backup: the bound measures time with no
                # restore running, so a slow first-ever restore is never timed
                # out from under us.
                stalled = 0 if reads(inprogress) == bootid else stalled + 5
                if stalled >= int(os.environ.get("WAIT_MAX", "1200")):
                    trace(f"gave up waiting after {waited}s")
                    print(f"[db-snapshot] WARN: no restore sentinel or activity "
                          f"for {stalled}s, proceeding", file=sys.stderr)
                    return True
                if waited % 60 == 0:
                    print(f"[db-snapshot] waiting for restic-restore to finish ({waited}s)")
                time.sleep(5)
                waited += 5
            return False

        trace("start")
        print(f"[db-snapshot] loop starting, interval={interval}s")
        if not wait_for_restore():
            print("[db-snapshot] exiting before first cycle")
            raise SystemExit(0)
        while not stopping:
            cycle()
            if stopping:
                break
            time.sleep(interval)
        print("[db-snapshot] exiting")
    environment:
      - DB_SNAPSHOT_INTERVAL=${DB_SNAPSHOT_INTERVAL:-1800}
    volumes:
      - hermes-data:/opt/data

  restic-backup:
    image: "docker.io/restic/restic:0.17.3@sha256:8f5a62b422a2cb1277ea0dd6e826fe1acf649e5b9f02d60e5268d5fd1976255a"
    platform: linux/amd64
    restart: unless-stopped
    entrypoint: /bin/sh
    # Gated at the END of the boot chain (restic-restore -> cache-prune).
    # Backing up a half-restored or half-pruned volume would
    # archive incomplete data, and once retention ages out the good snapshots
    # that is all that would remain. This direction of dependency cannot delay
    # hermes — nothing depends on restic-backup.
    # No depends_on by design. podman-compose turns a
    # `service_completed_successfully` dependency into podman's --requires,
    # which demands the dependency be RUNNING -- and re-triggers that one-shot
    # once per dependent. Every dependent therefore paid a full re-run:
    # measured 300s each on the rclone path, and 1800s once the restore stopped
    # publishing a sentinel, which is the 40-minute boot. Ordering is the
    # sentinel's job -- see wait_for_restore in the services below.
    command:
      - -c
      - |
        set -u
        INTERVAL=$${BACKUP_INTERVAL:-3600}

        trace() { echo "$$(date -u +%FT%TZ) restic-backup  $$1" >> /opt/data/.boot-trace 2>/dev/null || true; }
        trace start
        wait_for_restore() {
          marker=/opt/data/.restore-complete
          inprogress=/opt/data/.restore-inprogress
          bootid=$$(cat /proc/sys/kernel/random/boot_id)
          waited=0
          stalled=0
          while :; do
            if [ "$$(cat "$$marker" 2>/dev/null)" = "$$bootid" ]; then
              trace "proceeded after $${waited}s"
              echo "[backup] restore sentinel is fresh, proceeding"
              return 0
            fi
            # The timeout measures time with NO restore running, not wall-clock.
            # A first-ever restore pulls the whole repository and can legitimately
            # outlast any fixed bound; timing that out would snapshot the partial
            # tree it was still writing. So the clock only advances while the
            # in-progress marker says nothing is happening.
            if [ "$$(cat "$$inprogress" 2>/dev/null)" = "$$bootid" ]; then
              stalled=0
            else
              stalled=$$(( stalled + 5 ))
            fi
            if [ "$$stalled" -ge "$${WAIT_MAX:-1200}" ]; then
              trace "gave up waiting after $${waited}s, backing up unverified"
              echo "[backup] WARN: no restore sentinel or activity for $${stalled}s." >&2
              echo "[backup] WARN: backing up anyway, tagged restore-unverified." >&2
              UNVERIFIED=1
              return 0
            fi
            [ $$(( waited % 60 )) -eq 0 ] && \
              echo "[backup] waiting for restic-restore to finish ($${waited}s)"
            sleep 5; waited=$$(( waited + 5 ))
          done
        }

        UNVERIFIED=""
        wait_for_restore

        PRUNE_EVERY=$${PRUNE_EVERY_CYCLES:-24}

        # Written here rather than mounted: this compose file uses no bind
        # mounts, and adding one to ship a text file would change the enclave
        # measurement for no benefit.
        cat > /tmp/restic-excludes <<'EXCLUDES'
        # Caches, repo checkouts and installed tools, at the paths cache-prune
        # found them. cache-prune keeps repo and .npm-global on disk, but they
        # are still not backed up: a fresh-volume restore comes back without them.
        /opt/data/repo
        /opt/data/cache
        /opt/data/logs
        /opt/data/toolchains
        /opt/data/home/.cache
        /opt/data/home/.npm
        /opt/data/home/.npm-global
        /opt/data/home/.local/share/pnpm
        /opt/data/profiles/*/cache
        /opt/data/profiles/*/home/go/pkg/mod
        # Volatile runtime state namespaced to the machine that wrote it. This
        # list is hermes_cli/backup.py's own _IMPORT_SKIP_NAMES: Hermes excludes
        # these from its native backups because restoring them onto a different
        # host is "at best meaningless and at worst actively harmful".
        # gateway_state.json is the harmful one — it drives the container-boot
        # reconciler, and a stale value leaves the gateway stuck "starting" and
        # disconnected from the Nous portal.
        #
        # We restore the raw volume rather than going through `hermes backup
        # import`, so none of that filtering applies to us. backup.py claims the
        # container boot sweep already handles these, but _STALE_RUNTIME_FILES
        # is only ("gateway.pid", "processes.json") — the other three survive.
        /opt/data/gateway_state.json
        /opt/data/gateway.pid
        /opt/data/gateway.lock
        /opt/data/cron.pid
        /opt/data/processes.json
        /opt/data/profiles/*/gateway_state.json
        /opt/data/profiles/*/gateway.pid
        /opt/data/profiles/*/gateway.lock
        /opt/data/profiles/*/cron.pid
        /opt/data/profiles/*/processes.json
        # Live SQLite files. The clean VACUUM INTO copies under db-snapshots/
        # and security/snapshot.db are what actually get archived; a hot copy
        # can be torn, and state.db alone is ~300 MB of churn per run.
        /opt/data/security/live
        /opt/data/*.db
        /opt/data/*.db-wal
        /opt/data/*.db-shm
        # These rules are anchored, so the root-level ones above never matched
        # the per-profile databases. Measured on a recovery drill: 16 live
        # SQLite files were in the backup, including a 443 MB state.db and its
        # 163 MB WAL, copied hot -- exactly the torn-write risk the VACUUM INTO
        # copies exist to avoid, and stored alongside a clean copy of the same
        # data. restic-restore reinstates them from db-snapshots/, so excluding
        # the live files loses nothing.
        /opt/data/profiles/*/*.db
        /opt/data/profiles/*/*.db-wal
        /opt/data/profiles/*/*.db-shm
        /opt/data/cron/*.db
        /opt/data/cron/*.db-wal
        /opt/data/cron/*.db-shm
        /opt/data/db-snapshots/*.tmp
        # Package-store and browser-PKI databases, at any depth: the anchored
        # home/ rules below miss the copies under profiles/*/home/.
        **/.local/share/pnpm
        **/.local/share/pki
        # Boot coordination state: local to one machine, never restored.
        /opt/data/.restore-complete
        /opt/data/.restore-inprogress
        /opt/data/.last-backup-ok
        # Generic build and virtualenv noise, at any depth.
        **/node_modules
        **/__pycache__
        **/.venv
        **/.tox
        **/.pytest_cache
        **/.mypy_cache
        **/.ruff_cache
        *.pyc
        EXCLUDES
        echo "[backup] $$(grep -cvE '^[[:space:]]*(#|$$)' /tmp/restic-excludes) exclude rules loaded"

        shutdown_requested=0
        shutdown() {
          echo "[backup] signal received, will flush after current cycle"
          shutdown_requested=1
        }
        trap shutdown TERM INT

        cycle=0
        run_backup() {
          echo "[backup] cycle starting at $$(date -u +%FT%TZ)"
          start=$$(date +%s)

          if restic backup /opt/data \
               --host "$$RESTIC_HOST" \
               --exclude-file=/tmp/restic-excludes \
               --exclude-caches \
               --tag rofl $${UNVERIFIED:+--tag restore-unverified}; then
            elapsed=$$(( $$(date +%s) - start ))
            # Heartbeat for backup-watchdog. Local coordination state, never
            # restored -- a timestamp from the machine we are recovering FROM
            # would read as a fresh backup on the machine we recover TO.
            date +%s > /opt/data/.last-backup-ok
            echo "[backup] cycle complete in $${elapsed}s"
          else
            rc=$$?
            echo "[backup] WARN: backup failed (rc=$$rc), continuing" >&2
            return
          fi

          cycle=$$(( cycle + 1 ))
          [ "$$(( cycle % PRUNE_EVERY ))" -eq 0 ] || return

          # A ROFL machine dies without warning, so a SIGKILLed backup leaves a
          # lock object behind. Measured: that stale lock does NOT block the next
          # `restic backup` (it takes a non-exclusive lock), but it DOES block
          # `forget --prune` (exclusive, exit 11). Plain `restic unlock` will not
          # clear it either — restic proves staleness from hostname+PID, and the
          # hostname differs every run. --remove-all skips that proof, which is
          # safe here because this repository has exactly one writer.
          echo "[backup] running retention (cycle $$cycle)"
          restic unlock --remove-all || true
          if restic forget \
               --host "$$RESTIC_HOST" \
               --keep-hourly 24 --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
               --prune; then
            echo "[backup] retention complete"
          else
            echo "[backup] WARN: retention failed (rc=$$?), continuing" >&2
          fi
        }

        echo "[backup] loop starting, interval=$${INTERVAL}s, prune every $${PRUNE_EVERY} cycles"

        while [ "$$shutdown_requested" -eq 0 ]; do
          run_backup
          [ "$$shutdown_requested" -eq 1 ] && break
          sleep "$$INTERVAL" &
          wait $$! 2>/dev/null || true
        done

        echo "[backup] flushing final cycle before exit"
        run_backup
        echo "[backup] exiting"
    environment:
      - HOME=/tmp
      - RESTIC_CACHE_DIR=/tmp/restic-cache
      - RESTIC_HOST=rofl
      - RESTIC_REPOSITORY=s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=auto
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-3600}
      - PRUNE_EVERY_CYCLES=${PRUNE_EVERY_CYCLES:-24}
    volumes:
      - hermes-data:/opt/data

  # Alerts when backups stop arriving. Deliberately gated on NOTHING.
  #
  # This exists because of a 17-hour silent gap: restic-backup was stuck in
  # wait_for_restore, before its backup loop, waiting on a sentinel that never
  # came. Any check inside that loop would never have run -- and cache-prune and
  # db-snapshot block on the same sentinel, so none of them could have noticed
  # either. A watchdog that shares the dependency it is watching is not a
  # watchdog, so this one waits for nothing and starts immediately.
  #
  # It catches "the machine is up but backups are not happening". It cannot
  # catch "the machine is gone" -- nothing running on the machine can. That
  # needs an external check; see README.
  backup-watchdog:
    image: "docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"
    platform: linux/amd64
    restart: unless-stopped
    # /opt/data is hermes' HOME and is mode 700 owned by uid 10000. This image
    # defaults to uid 100 (curl_user), which cannot even traverse it -- the
    # heartbeat read failed with EACCES and every check reported "never".
    # Run as the owner rather than as root: reading one file needs no more.
    user: "10000:10000"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -u
        INTERVAL=$${WATCHDOG_INTERVAL:-900}
        STALE=$${BACKUP_STALE_AFTER:-10800}
        REALERT=$${ALERT_REPEAT_AFTER:-21600}

        # Telegram wants a chat id; TELEGRAM_ALLOWED_USERS is a comma-separated
        # list of user ids, and a user id is a valid chat id once that user has
        # talked to the bot -- which they have, it is their own agent.
        CHAT=$${ALERT_CHAT_ID:-}
        [ -n "$$CHAT" ] || CHAT=$$(printf '%s' "$${TELEGRAM_ALLOWED_USERS:-}" | cut -d, -f1)

        alert() {
          echo "[watchdog] ALERT: $$1" >&2
          if [ -z "$${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "$$CHAT" ]; then
            echo "[watchdog] no telegram token/chat configured, logged only" >&2
            return 0
          fi
          code=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot$${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$$CHAT" \
            --data-urlencode "text=$$1" 2>/dev/null) || code=000
          if [ "$$code" = "200" ]; then
            echo "[watchdog] alert delivered"
          else
            echo "[watchdog] WARN: telegram returned $$code" >&2
          fi
        }

        last_alert=0
        echo "[watchdog] started: interval=$${INTERVAL}s stale_after=$${STALE}s"

        while :; do
          # Grace is measured from kernel uptime, not the clock: a TDX VM syncs
          # its clock AFTER boot, and an early wall-clock read once produced a
          # bogus epoch that broke the restore sentinel for 17 hours. Uptime
          # cannot jump.
          up=$$(cut -d. -f1 /proc/uptime)
          if [ "$$up" -lt "$$STALE" ]; then
            sleep "$$INTERVAL"; continue
          fi

          now=$$(date +%s)
          HEARTBEAT=/opt/data/.last-backup-ok

          # "cannot read it" and "it never happened" are different problems and
          # must not produce the same message. Conflating them turned a
          # permissions mistake in this very service into an hourly alert saying
          # backups had never run, while they were in fact running every hour.
          if [ ! -x /opt/data ]; then
            # Cannot even traverse the directory, so -e below would report the
            # heartbeat as absent when it may be perfectly fine. Test this first
            # or a permissions fault masquerades as "backups never ran".
            msg="watchdog cannot read /opt/data (permissions) -- backups may well be fine, this is a fault in the watchdog itself"
            stale=1
          elif [ ! -e "$$HEARTBEAT" ]; then
            msg="no successful backup has been recorded yet"
            stale=1
          elif ! last=$$(cat "$$HEARTBEAT" 2>/dev/null); then
            msg="watchdog cannot READ $$HEARTBEAT (permissions?) -- backups may well be fine, this is a fault in the watchdog itself"
            stale=1
          else
            case "$$last" in ''|*[!0-9]*) last=0 ;; esac
            if [ "$$last" -eq 0 ]; then
              msg="heartbeat file is empty or malformed"
              stale=1
            elif [ "$$(( now - last ))" -gt "$$STALE" ]; then
              msg="last successful backup was $$(( (now - last) / 60 ))m ago"
              stale=1
            else
              stale=0
            fi
          fi

          if [ "$$stale" -eq 1 ] && [ "$$(( now - last_alert ))" -ge "$$REALERT" ]; then
            alert "Hermes ROFL backup alert: $$msg (threshold $$(( STALE / 60 ))m). Check: just restic-snapshots"
            last_alert=$$now
          fi

          sleep "$$INTERVAL"
        done
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - ALERT_CHAT_ID=${ALERT_CHAT_ID:-}
      - WATCHDOG_INTERVAL=${WATCHDOG_INTERVAL:-900}
      - BACKUP_STALE_AFTER=${BACKUP_STALE_AFTER:-10800}
      - ALERT_REPEAT_AFTER=${ALERT_REPEAT_AFTER:-21600}
    volumes:
      - hermes-data:/opt/data

volumes:
  hermes-data:
